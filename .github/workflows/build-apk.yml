name: Build SmartTube Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mobile patch
        uses: actions/checkout@v4

      - name: Fetch official SmartTube
        run: |
          git clone --recurse-submodules https://github.com/yuliskov/SmartTube.git upstream
          cd upstream
          git apply ../mobile.patch
          chmod +x gradlew

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Build mobile debug APK
        working-directory: upstream
        run: ./gradlew :smarttubetv:assembleStmobileDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          find upstream/smarttubetv/build/outputs/apk -type f -name "*.apk" -exec cp {} output/SmartTube-Mobile.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Mobile-APK
          path: output/SmartTube-Mobile.apk
          if-no-files-found: error
