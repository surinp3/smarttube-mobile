name: Build SmartTube Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mobile patch
        uses: actions/checkout@v4

      - name: Fetch official SmartTube
        run: |
          git clone --recurse-submodules https://github.com/yuliskov/SmartTube.git upstream
          cd upstream
          git apply ../mobile.patch
          chmod +x gradlew

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Build mobile ARM64 debug APK
        working-directory: upstream
        run: ./gradlew :smarttubetv:assembleStmobileDebug --stacktrace

      - name: Collect ARM64 APK
        run: |
          mkdir -p output
          find upstream/smarttubetv/build/outputs/apk -type f -name "*.apk" -print
          apk_path="$(find upstream/smarttubetv/build/outputs/apk -type f -name "*arm64-v8a.apk" | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" output/SmartTube-Mobile-ARM64.apk
          file output/SmartTube-Mobile-ARM64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Mobile-ARM64-APK
          path: output/SmartTube-Mobile-ARM64.apk
          if-no-files-found: error
