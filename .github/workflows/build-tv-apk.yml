name: Build SmartTube Pat TV APK

on:
  pull_request:
    paths:
      - 'tv.patch'
      - 'news.patch'
      - 'news-mediaservice.patch'
      - 'tv-player.patch'
      - 'pat-sync.patch'
      - 'mobile.patch'
      - 'mediaservice.patch'
      - 'tests/test_playback_regressions.py'
      - 'tests/test_discovery.py'
      - 'tests/java/**'
      - 'tv-mediaservice.patch'
      - 'tv_update.json'
      - 'upstream-pins.json'
      - '.github/workflows/build-tv-apk.yml'
  push:
    branches: [main]
    paths:
      - 'tv.patch'
      - 'news.patch'
      - 'news-mediaservice.patch'
      - 'tv-player.patch'
      - 'pat-sync.patch'
      - 'mobile.patch'
      - 'mediaservice.patch'
      - 'tests/test_playback_regressions.py'
      - 'tests/test_discovery.py'
      - 'tests/java/**'
      - 'tv-mediaservice.patch'
      - 'tv_update.json'
      - 'upstream-pins.json'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout TV edition patches
        uses: actions/checkout@v4

      - name: Check original SmartTube video-fetching updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py --mode report

      - name: Fetch and patch the pinned SmartTube source
        run: |
          smarttube_pin="$(jq -r '.smarttube.pinned' upstream-pins.json)"
          mediaservice_pin="$(jq -r '.mediaservice.pinned' upstream-pins.json)"
          git clone https://github.com/yuliskov/SmartTube.git upstream
          git -C upstream checkout "$smarttube_pin"
          git -C upstream submodule update --init --recursive
          git -C upstream/MediaServiceCore checkout "$mediaservice_pin"
          git -C upstream apply --check ../mobile.patch
          git -C upstream apply ../mobile.patch
          git -C upstream/MediaServiceCore apply --check ../../mediaservice.patch
          git -C upstream/MediaServiceCore apply ../../mediaservice.patch
          git -C upstream/MediaServiceCore apply --check ../../news-mediaservice.patch
          git -C upstream/MediaServiceCore apply ../../news-mediaservice.patch
          git -C upstream apply --check ../tv.patch
          git -C upstream apply ../tv.patch
          git -C upstream apply --check ../pat-sync.patch
          git -C upstream apply ../pat-sync.patch
          git -C upstream apply --check ../news.patch
          git -C upstream apply ../news.patch
          git -C upstream apply --check ../tv-player.patch
          git -C upstream apply ../tv-player.patch
          git -C upstream/MediaServiceCore apply --check ../../tv-mediaservice.patch
          git -C upstream/MediaServiceCore apply ../../tv-mediaservice.patch
          chmod +x upstream/gradlew

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Default pull request builds to debug test APKs
        run: echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"

      - name: Configure permanent production signing on main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          MOBILE_SIGNING_BUNDLE_B64: ${{ secrets.MOBILE_SIGNING_BUNDLE_B64 }}
          MOBILE_KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
          MOBILE_STORE_PASSWORD: ${{ secrets.MOBILE_STORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -n "$MOBILE_SIGNING_BUNDLE_B64" ]; then
            printf '%s' "$MOBILE_SIGNING_BUNDLE_B64" | base64 --decode > signing-bundle.zip
            unzip -p signing-bundle.zip keystore.properties > upstream/keystore.properties
            unzip -p signing-bundle.zip smarttubetv/mobile-release.jks > upstream/smarttubetv/mobile-release.jks
            test -s upstream/keystore.properties
            test -s upstream/smarttubetv/mobile-release.jks
            rm signing-bundle.zip
          elif [ -n "$MOBILE_KEYSTORE_B64" ] && [ -n "$MOBILE_STORE_PASSWORD" ] && [ -n "$MOBILE_KEY_ALIAS" ] && [ -n "$MOBILE_KEY_PASSWORD" ]; then
            printf '%s' "$MOBILE_KEYSTORE_B64" | base64 --decode > upstream/smarttubetv/mobile-release.jks
            {
              printf 'storeFile=mobile-release.jks\n'
              printf 'storePassword=%s\n' "$MOBILE_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$MOBILE_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$MOBILE_KEY_PASSWORD"
            } > upstream/keystore.properties
          else
            echo "::error::The permanent signing bundle is required for a live TV release."
            exit 1
          fi
          echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"

      - name: Fetch verified Gradle distribution through the release API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gradle_zip="$RUNNER_TEMP/gradle-7.5-bin.zip"
          gradle_sha="cb87f222c5585bd46838ad4db78463a5c5f3d336e5e2b98dc7c0c586527351c2"
          # Use the release API because the browser download route can return HTTP 504.
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/gradle/gradle-distributions/releases/assets/127707999" \
            -o "$gradle_zip"
          printf '%s  %s\n' "$gradle_sha" "$gradle_zip" | sha256sum --check --strict
          wrapper=upstream/gradle/wrapper/gradle-wrapper.properties
          sed -i "s|^distributionUrl=.*|distributionUrl=file://$gradle_zip|" "$wrapper"
          printf '\ndistributionSha256Sum=%s\n' "$gradle_sha" >> "$wrapper"

      - name: Verify playback recovery control flow
        env:
          SMARTTUBE_SOURCE_DIR: upstream
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify SABR attestation recovery
        working-directory: upstream
        run: ./gradlew :exoplayer-library-sabr:testStstableDebugUnitTest --tests '*SabrProtectionStatusTest' --stacktrace

      - name: Verify temporary buffer and news locale behavior
        working-directory: upstream
        run: ./gradlew :common:testStstableDebugUnitTest --tests '*SessionLoadControlTest' --tests '*PreferredNewsRequestTest' --tests '*PreferredNewsFeedTest' --stacktrace

      - name: Verify Rumble news filtering
        working-directory: upstream
        run: ./gradlew :smarttubetv:testStmobileDebugUnitTest --tests '*PreferredRumbleNewsTest' --stacktrace

      - name: Verify TV player suggestions and remote control
        working-directory: upstream
        run: ./gradlew :smarttubetv:testStpattvDebugUnitTest --tests '*TvPlayerSuggestionsTest' --stacktrace

      - name: Build all Google TV ARM architectures
        working-directory: upstream
        run: |
          if [ "$SIGNED_BUILD" = 'true' ]; then
            ./gradlew :smarttubetv:assembleStpattvRelease --stacktrace
          else
            ./gradlew :smarttubetv:assembleStpattvDebug --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p output
          # Google TV Streamer has a 64-bit CPU, but some firmware only accepts
          # 32-bit native app libraries. Supply both ABI splits and a universal.
          variant=debug
          if [ "$SIGNED_BUILD" = 'true' ]; then variant=release; fi
          apk_root="upstream/smarttubetv/build/outputs/apk/stpattv/$variant"
          apk_armv7="$(find "$apk_root" -type f -name '*armeabi-v7a.apk' | head -n 1)"
          apk_arm64="$(find "$apk_root" -type f -name '*arm64-v8a.apk' | head -n 1)"
          apk_universal="$(find "$apk_root" -type f -name '*universal.apk' | head -n 1)"
          test -n "$apk_armv7"
          test -n "$apk_arm64"
          test -n "$apk_universal"
          if [ "$SIGNED_BUILD" = 'true' ]; then
            cp "$apk_armv7" output/SmartTube-Pat-TV-v16-ARMv7.apk
            cp "$apk_arm64" output/SmartTube-Pat-TV-v16-ARM64.apk
            cp "$apk_universal" output/SmartTube-Pat-TV-v16-Universal.apk
            echo 'APK_ARTIFACT_NAME=SmartTube-Pat-TV-v16-SIGNED-APKs' >> "$GITHUB_ENV"
          else
            cp "$apk_armv7" output/SmartTube-Pat-TV-v16-ARMv7-DEBUG-TEST-ONLY.apk
            cp "$apk_arm64" output/SmartTube-Pat-TV-v16-ARM64-DEBUG-TEST-ONLY.apk
            cp "$apk_universal" output/SmartTube-Pat-TV-v16-Universal-DEBUG-TEST-ONLY.apk
            echo 'APK_ARTIFACT_NAME=SmartTube-Pat-TV-v16-DEBUG-TEST-ONLY' >> "$GITHUB_ENV"
          fi
          file output/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: output/*.apk
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download production-signed TV APK
        uses: actions/download-artifact@v4
        with:
          name: SmartTube-Pat-TV-v16-SIGNED-APKs
          path: output
      - name: Stage TV release for signature verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tv-v16 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'tv-v16 is already published; increment the TV version for the next release.'
          else
            gh release create tv-v16 \
              output/SmartTube-Pat-TV-v16-ARMv7.apk \
              output/SmartTube-Pat-TV-v16-ARM64.apk \
              output/SmartTube-Pat-TV-v16-Universal.apk \
              --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title 'SmartTube Pat TV v16 - Verified Swedish and English news' \
              --notes 'Adds live-verified Swedish business-news publishers EFN Ekonomikanalen and Dagens industri, preserving the fuller English breaking-news selection. Collects fresh news from multiple Swedish and English breaking-news publishers, filters old clips, satire and Thai results, deduplicates videos and limits each publisher. Targets up to 24 videos per language as current sources permit. Preserves playback recovery, related-video controls, temporary buffering, Rumble, sync and rollback. Live feed probes and automated tests are recorded in NEWS_FEED_FIX.md; actual device playback remains unverified.' \
              --latest=false
          fi
