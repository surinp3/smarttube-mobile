name: Watch original SmartTube video-fetching code

on:
  schedule:
    # Approximately 09:17 and 21:17 in Thailand (GitHub cron uses UTC).
    - cron: '17 2,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'upstream-pins.json'
      - 'scripts/check_upstream.py'
      - '.github/workflows/check-upstream.yml'

permissions:
  contents: read
  issues: write

jobs:
  review-playback-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned sources with the original SmartTube repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py --mode issue
