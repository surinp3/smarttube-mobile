name: Restore known-good SmartTube release

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which installed app needs recovery?'
        type: choice
        options: [tv, mobile]
        required: true
      known_good_release:
        description: 'Existing WORKING release tag (e.g. tv-v2 or v13)'
        type: string
        required: true
      new_release_number:
        description: 'Next public app release number, greater than all existing releases (e.g. TV 4 or Mobile 15)'
        type: string
        required: true
      new_version_code:
        description: 'New Android versionCode, GREATER than the broken installed APK (e.g. 3004 or 2468)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: smarttube-recovery-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  rebuild-known-good:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout trusted recovery tooling from main
        uses: actions/checkout@v4

      - name: Validate requested recovery release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_APP: ${{ inputs.app }}
          KNOWN_GOOD_TAG: ${{ inputs.known_good_release }}
          NEW_RELEASE_NUMBER: ${{ inputs.new_release_number }}
          NEW_VERSION_CODE: ${{ inputs.new_version_code }}
        run: |
          set -euo pipefail
          if ! [[ "$NEW_RELEASE_NUMBER" =~ ^[1-9][0-9]{0,5}$ ]] || ! [[ "$NEW_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo '::error::Release number and Android versionCode must be positive integers.'
            exit 1
          fi
          if [ "$RECOVERY_APP" = tv ]; then
            [[ "$KNOWN_GOOD_TAG" =~ ^tv-v[0-9]+$ ]] || { echo '::error::Choose a TV production release, e.g. tv-v2'; exit 1; }
            recovery_tag="tv-v${NEW_RELEASE_NUMBER}"
          else
            [[ "$KNOWN_GOOD_TAG" =~ ^v[0-9]+$ ]] || { echo '::error::Choose a Mobile production release, e.g. v13'; exit 1; }
            recovery_tag="v${NEW_RELEASE_NUMBER}"
          fi
          gh release view "$KNOWN_GOOD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          if gh release view "$recovery_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $recovery_tag already exists. Pick the next version."
            exit 1
          fi
          echo "RECOVERY_TAG=$recovery_tag" >> "$GITHUB_ENV"
          echo "RECOVERY_APP=$RECOVERY_APP" >> "$GITHUB_ENV"
          echo "KNOWN_GOOD_TAG=$KNOWN_GOOD_TAG" >> "$GITHUB_ENV"
          echo "NEW_RELEASE_NUMBER=$NEW_RELEASE_NUMBER" >> "$GITHUB_ENV"
          echo "NEW_VERSION_CODE=$NEW_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Checkout only the chosen existing production source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.known_good_release }}
          path: known-good

      - name: Compare release numbers and fetch pinned known-good sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > release-tags.txt
          if [ -f known-good/upstream-pins.json ]; then
            source_pin_file=known-good/upstream-pins.json
          else
            # Versions released before upstream-pins.json was introduced.
            source_pin_file=upstream-pins.json
          fi
          smarttube_pin="$(jq -r '.smarttube.pinned' "$source_pin_file")"
          mediaservice_pin="$(jq -r '.mediaservice.pinned' "$source_pin_file")"
          git clone https://github.com/yuliskov/SmartTube.git upstream
          git -C upstream checkout "$smarttube_pin"
          git -C upstream submodule update --init --recursive
          git -C upstream/MediaServiceCore checkout "$mediaservice_pin"
          git -C upstream apply --check ../known-good/mobile.patch
          git -C upstream apply ../known-good/mobile.patch
          git -C upstream/MediaServiceCore apply --check ../../known-good/mediaservice.patch
          git -C upstream/MediaServiceCore apply ../../known-good/mediaservice.patch
          if [ "$RECOVERY_APP" = tv ]; then
            git -C upstream apply --check ../known-good/tv.patch
            git -C upstream apply ../known-good/tv.patch
            git -C upstream/MediaServiceCore apply --check ../../known-good/tv-mediaservice.patch
            git -C upstream/MediaServiceCore apply ../../known-good/tv-mediaservice.patch
            current_patch=tv.patch
          else
            current_patch=mobile.patch
          fi
          if [ -f known-good/pat-sync.patch ]; then
            git -C upstream apply --check ../known-good/pat-sync.patch
            git -C upstream apply ../known-good/pat-sync.patch
          fi
          python3 scripts/prepare_recovery.py \
            --app "$RECOVERY_APP" \
            --known-good-tag "$KNOWN_GOOD_TAG" \
            --release-number "$NEW_RELEASE_NUMBER" \
            --version-code "$NEW_VERSION_CODE" \
            --release-tags release-tags.txt \
            --current-patch "$current_patch" \
            --source-dir upstream
          echo "RECOVERY_SOURCE_SHA=$(git -C known-good rev-parse HEAD)" >> "$GITHUB_ENV"
          chmod +x upstream/gradlew

      - name: Configure Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Restore original permanent signing key
        env:
          MOBILE_SIGNING_BUNDLE_B64: ${{ secrets.MOBILE_SIGNING_BUNDLE_B64 }}
          MOBILE_KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
          MOBILE_STORE_PASSWORD: ${{ secrets.MOBILE_STORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$MOBILE_SIGNING_BUNDLE_B64" ]; then
            printf '%s' "$MOBILE_SIGNING_BUNDLE_B64" | base64 --decode > signing-bundle.zip
            unzip -p signing-bundle.zip keystore.properties > upstream/keystore.properties
            unzip -p signing-bundle.zip smarttubetv/mobile-release.jks > upstream/smarttubetv/mobile-release.jks
            test -s upstream/keystore.properties
            test -s upstream/smarttubetv/mobile-release.jks
            rm signing-bundle.zip
          elif [ -n "$MOBILE_KEYSTORE_B64" ] && [ -n "$MOBILE_STORE_PASSWORD" ] && [ -n "$MOBILE_KEY_ALIAS" ] && [ -n "$MOBILE_KEY_PASSWORD" ]; then
            printf '%s' "$MOBILE_KEYSTORE_B64" | base64 --decode > upstream/smarttubetv/mobile-release.jks
            {
              printf 'storeFile=mobile-release.jks\n'
              printf 'storePassword=%s\n' "$MOBILE_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$MOBILE_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$MOBILE_KEY_PASSWORD"
            } > upstream/keystore.properties
          else
            echo '::error::Permanent signing key is unavailable; refusing to publish a recovery that cannot update the installed app.'
            exit 1
          fi

      - name: Compile a signed APK from known-good code
        working-directory: upstream
        run: |
          if [ "$RECOVERY_APP" = tv ]; then
            ./gradlew :smarttubetv:assembleStpattvRelease --stacktrace
          else
            ./gradlew :smarttubetv:assembleStmobileRelease --stacktrace
          fi

      - name: Collect the production-signed recovery APKs
        run: |
          set -euo pipefail
          mkdir -p output
          if [ "$RECOVERY_APP" = tv ]; then
            for abi in ARMv7:armeabi-v7a ARM64:arm64-v8a Universal:universal; do
              label="${abi%%:*}"
              pattern="${abi#*:}"
              apk_path="$(find upstream/smarttubetv/build/outputs/apk -type f -name "*$pattern.apk" | head -n 1)"
              test -n "$apk_path"
              cp "$apk_path" "output/SmartTube-Pat-TV-v${NEW_RELEASE_NUMBER}-${label}.apk"
            done
          else
            apk_path="$(find upstream/smarttubetv/build/outputs/apk -type f -name '*arm64-v8a.apk' | head -n 1)"
            test -n "$apk_path"
            cp "$apk_path" "output/SmartTube-Mobile-v${NEW_RELEASE_NUMBER}-ARM64.apk"
          fi
          file output/*.apk

      - name: Archive the recovery APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-${{ inputs.app }}-Recovery-${{ inputs.new_release_number }}
          path: output/*.apk
          if-no-files-found: error

      - name: Publish signed production recovery release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$RECOVERY_APP" = tv ]; then
            latest_flag='--latest=false'
            title="SmartTube Pat TV v${NEW_RELEASE_NUMBER} (recovery)"
          else
            # MobileUpdater recognizes vNN tags from the GitHub Latest API.
            latest_flag='--latest'
            title="SmartTube Mobile v${NEW_RELEASE_NUMBER} (recovery)"
          fi
          gh release create "$RECOVERY_TAG" output/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RECOVERY_SOURCE_SHA" \
            --title "$title" \
            --notes "Production-signed rollback: restores playback code from known-good $KNOWN_GOOD_TAG. Android versionCode $NEW_VERSION_CODE is higher than the broken version, so Android can install this over the existing app without clearing its data. After recovery, test sign-in and video playback." \
            "$latest_flag"

      - name: Make the TV's in-app updater offer this recovery
        if: inputs.app == 'tv'
        run: |
          set -euo pipefail
          python3 scripts/retarget_tv_update.py tv_update.json \
            --release-number "$NEW_RELEASE_NUMBER" \
            --version-code "$NEW_VERSION_CODE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv_update.json
          git commit -m "Point TV in-app updater at recovery release $RECOVERY_TAG"
          git push origin HEAD:main
