services:
  smarttube-sync:
    build:
      context: ..
      dockerfile: vps-sync/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    environment:
      SMARTTUBE_DB_PATH: /data/smarttube.sqlite
      SMARTTUBE_SETUP_CODE: ${SMARTTUBE_SETUP_CODE:?Set this in vps-sync/.env}
      APISH_KEY: ${APISH_KEY:-}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - smarttube_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  smarttube_data:
